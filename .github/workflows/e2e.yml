name: E2E and Unit Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          fi
          xcodebuild -version || true
          swift --version

      - name: Run Swift Unit Tests
        run: swift test

      - name: Run Automated End-to-End (E2E) Tests
        run: |
          chmod +x ./package-app.sh ./scripts/run_e2e_tests.swift ./scripts/test-e2e.sh
          ./scripts/test-e2e.sh
